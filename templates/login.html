{% extends "base.html" %}
{% load static %}

{% block extra_js %}
    <script src="{% static 'js/login.js' %}"></script>
{% endblock extra_js %}

{% block content %}
<div class="form-container">
	<h2>Вход</h2>

	<form id='loginForm' method='POST' action="{% url 'token_obtain_pair' %}">
		{% csrf_token %}
		<!-- Email input -->
		<div data-mdb-input-init class="form-outline mb-4">
			<input type="text" name='username' id="form2Example1" class="form-control" />
			<label class="form-label" for="form2Example1">Имя</label>
		</div>

		<!-- Password input -->
		<div data-mdb-input-init class="form-outline mb-4">
			<input type="password" name='password' id="form2Example2" class="form-control" />
			<label class="form-label" for="form2Example2">Пароль</label>
		</div>

		{% comment %} <!-- 2 column grid layout for inline styling -->
		<div class="row mb-4">
			<div class="col d-flex justify-content-center">
				<!-- Checkbox -->
				<div class="form-check">
					<input class="form-check-input" type="checkbox" value="" id="form2Example31" checked />
					<label class="form-check-label" for="form2Example31"> Запомнить меня </label>
				</div>
			</div>

			<div class="col">
			<!-- Simple link -->
			<a href="#!">Забыл пароль?</a>
			</div>
		</div> {% endcomment %}

		<!-- Submit button -->
		<button  type="submit" class="btn btn-primary btn-block mb-4">Вход</button>

		<!-- Register buttons -->
		<div class="text-center">
			<p>Нет акаунта? <a href="{% url "register" %}">Регистрация</a></p>
			{% comment %} <p>or sign up with:</p>
			<button  type="button" class="btn btn-link btn-floating mx-1">
				<i class="fab fa-facebook-f"></i>
			</button>  {% endcomment %}
		</div>
	</form>
</div>
{% endblock content %}
