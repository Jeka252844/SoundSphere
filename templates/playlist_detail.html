{% extends "base.html" %}
{% load static %}

{% block extra_js %}
    <link rel="stylesheet" href="{% static 'css/playlist_detail.css' %}">
    <script src="{% static 'js/playlist_detail.js' %}"></script>
{% endblock %}

{% block content %}
<div class="playlist-detail-wrapper">
    <script>
        const PLAYLIST_ID = "{{ playlist_id|default:'' }}";
    </script>

    <div class="playlist-header">
        <button class="btn-back" onclick="history.back()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Назад
        </button>

        <div class="playlist-header-content">
            <div class="playlist-header-cover" id="playlistCover">
            </div>

            <div class="playlist-header-info">
                <span class="playlist-type">Плейлист</span>
                <h1 class="playlist-name" id="playlistName">Загрузка...</h1>
                <p class="playlist-author" id="playlistAuthor"></p>
                <div class="playlist-stats" id="playlistStats"></div>
            </div>
        </div>

        <div class="playlist-header-actions">
            <button class="btn-listen-main" id="btnPlayAll">▶ Играть все</button>
            
            <div class="playlist-action-btns">
                <button class="action-btn" id="btnLike" title="Лайк">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    <span id="likesCount">0</span>
                </button>
                
                <button class="action-btn" id="btnShare" title="Поделиться">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="playlist-tracks-section">
        <div class="track-list" id="playlistTracks">
            <p class="text-muted text-center py-4">Загрузка треков...</p>
        </div>
    </div>
</div>
<div class="modal-overlay" id="reportModal" style="display:none;"></div>
{% endblock content %}
