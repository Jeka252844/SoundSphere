{% extends "base.html" %}
{% load static %}

{% block extra_js %}
  <script src="{% static 'js/profile.js' %}"></script>
{% endblock extra_js %}

{% block content %}
<section style="background-color: #111; width: 900px; margin: 0 auto;">
  <div class="container py-5">
		<div id="profileInfo" class="profile">
    	<div class="row">
				<div class="col-lg-4">
					<div class="card mb-4" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(68,183,139,0.2);">
						<div class="card-body text-center">
							<img class="text-white-50" id="userAvatar" src="" alt="avatar"
								class="rounded-circle img-fluid" style="width: 150px;">
							<h5 class="my-3 text-white" id="profileName">Загрузка...</h5>
							<p class="text-white-50 mb-1" id="profileRole"></p>
						</div>
					</div>
				</div>
				
				<div class="col-lg-8">
					<div class="card mb-4" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(68,183,139,0.2);">
						<div class="card-body text-white" >
							<div class="row">
								<div class="col-sm-3"><p class="mb-0">Имя</p></div>
								<div class="col-sm-9"><p class="text-white-50 mb-0" id="profileUsername"></p></div>
							</div>
							<hr>
							<div class="row">
								<div class="col-sm-3"><p class="mb-0">Email</p></div>
								<div class="col-sm-9"><p class="text-white-50 mb-0" id="profileEmail"></p></div>
							</div>
							<hr>
							<div class="row">
								<div class="col-sm-3"><p class="mb-0">Телефон</p></div>
								<div class="col-sm-9"><p class="text-white-50 mb-0" id="profilePhone"></p></div>
							</div>
							<hr>
							<div class="row">
								<div class="col-sm-3"><p class="mb-0">О себе</p></div>
								<div class="col-sm-9"><p class="text-white-50 mb-0" id="profileBioText"></p></div>
							</div>
							<hr>
							<div class="d-flex justify-content-between">
								<button class="btn btn-outline-primary" id="editProfileBtn">Редактировать</button>
								<button class="btn btn-outline-danger" id="deleteProfileBtn">Удалить</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div id="profileEdit" style="display: none;">
			<div class="col-lg-8 mx-auto">
				<div class="card mb-4" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(68,183,139,0.2);">
					<div class="card-body text-white">
						<form id="profileEditForm">
							<div class="mb-3">
								<label>Аватар</label>
								<input type="file" id="avatarInput" class="form-control" accept="image/*">
							</div>
							<div class="mb-3">
								<label>Имя пользователя</label>
								<input type="text" id="editUsername" class="form-control">
							</div>
							<div class="mb-3">
								<label>Email</label>
								<input type="email" id="editEmail" class="form-control">
							</div>
							<div class="mb-3">
								<label>Телефон</label>
								<input type="text" id="editPhone" class="form-control">
							</div>
							<div class="mb-3">
								<label>О себе</label>
								<textarea id="editBio" class="form-control" rows="3"></textarea>
							</div>
							<div class="d-flex justify-content-between">
								<button type="submit" class="btn btn-primary">Сохранить</button>
								<button type="button" class="btn btn-outline-secondary" id="cancelEditBtn">Отмена</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
  </div>
</section>
{% endblock content %}
