{% extends "base.html" %}
{% load static %}

{% block extra_js %}
    <link rel="stylesheet" href="{% static 'css/track_card.css' %}">
    <script src="{% static 'js/track_card.js' %}"></script>
{% endblock extra_js %}

{% block content %}
<div class="track-detail-card">
    <script>
        const TRACK_ID = "{{ track_id|default:'' }}";
    </script>
    
    <div class="track-detail-cover">
        <button class="btn-back" onclick="history.back()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Назад
        </button>

        <div class="default-avatar-svg"></div>

        <!-- Текст поверх -->
        <div class="track-detail-overlay">
            <h1 class="track-detail-title">Django Resonance</h1>
            <p class="track-detail-artist">SoundSphere Originals</p>
        </div>
    </div>

    <div class="track-detail-footer">
        <button class="btn-listen-main">▶ Слушать</button>

        <div class="track-actions-row">
            <button class="action-icon-btn" title="Лайк">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span>Лайк</span>
            </button>
            <button class="action-icon-btn" title="В плейлист">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                <span>Плейлист</span>
            </button>
            <button class="action-icon-btn" title="Поделиться">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                <span>Поделиться</span>
            </button>
            <button class="action-icon-btn report-btn" title="Пожаловаться">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path></svg>
                <span>Жалоба</span>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="reportModal" style="display:none;"></div>

    <div class="modal-overlay" id="playlistModal" style="display:none;">
    <div class="modal-content" style="max-width:400px;">
        <div class="modal-header">
            <h3>Добавить в плейлист</h3>
            <button class="modal-close" id="closePlaylistModal">✕</button>
        </div>
        <div class="modal-body" style="max-height:300px;overflow-y:auto;" id="playlistListBody">
            <p class="text-muted text-center">Загрузка...</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-sm btn-outline-secondary" id="cancelPlaylist">Отмена</button>
        </div>
    </div>
</div>
</div>
{% endblock %}
